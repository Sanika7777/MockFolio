<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Economy | MockFolio</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="economy">
    <div id="app">
      <main class="page">
        <section class="page-intro compact-intro">
          <span class="eyebrow">ECONOMIC CALENDAR</span>
          <h1>The economy, mapped and scheduled.</h1>
          <p>How economies compare, and the rate decisions, inflation prints and GDP releases coming up next.</p>
        </section>
        <section class="toolbar feed-toolbar" id="map-controls"></section>
        <div class="panel tv-widget-panel tv-economic-map" id="tv-economic-map"></div>
        <section class="section-heading spaced"><div><span class="eyebrow">CALENDAR</span><h2>Upcoming events</h2></div></section>
        <section class="toolbar feed-toolbar" id="economy-controls"></section>
        <div class="panel tv-widget-panel tv-feed" id="tv-economy"></div>
        <p class="chart-caption">Provided by TradingView. Real-world data, separate from MockFolio's simulated prices.</p>
      </main>
    </div>
    <div id="toast-region" class="toast-region"></div>
    <script src="js/api.js"></script>
    <script src="js/tradingview.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
