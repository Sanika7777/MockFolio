<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Portfolio | MockFolio</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body data-page="portfolio">
    <div id="app">
      <main class="page">
        <section class="portfolio-head">
          <div>
            <span class="eyebrow">HOLDINGS OVERVIEW</span>
            <div class="portfolio-title">
              <h1>Portfolio</h1>
              <span class="status-pill" id="positions-pill"></span>
            </div>
          </div>
          <div class="portfolio-actions">
            <a class="ghost-button" href="orders.html">Order book</a>
            <a class="primary-button" href="index.html">+ New paper trade</a>
          </div>
        </section>
        <section class="stats stats-five" id="stats"></section>
        <section class="insights-grid" id="portfolio-insights"></section>
        <section class="charts-grid" id="portfolio-charts"></section>
        <div class="section-heading">
          <div>
            <span class="eyebrow">HOLDINGS</span>
            <h2>Your positions</h2>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Stock</th>
                <th>Quantity</th>
                <th>Average buy</th>
                <th>Current price</th>
                <th>Invested</th>
                <th>Current value</th>
                <th>P&L</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="portfolio-table" data-cols="8"></tbody>
          </table>
        </div>
        <p class="table-foot" id="portfolio-foot"></p>
      </main>
    </div>
    <div id="toast-region" class="toast-region"></div>
    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
