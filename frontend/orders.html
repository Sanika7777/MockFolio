<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Orders | MockFolio</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="orders">
    <div id="app">
      <main class="page">
        <section class="page-intro compact-intro">
          <span class="eyebrow">ACTIVITY</span>
          <h1>Orders & trades</h1>
          <p>A complete record of how your paper portfolio has changed.</p>
        </section>
        <section class="section-heading">
          <div>
            <span class="eyebrow">ORDERS</span>
            <h2>Order history</h2>
          </div>
        </section>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Stock</th>
                <th>Type</th>
                <th>Quantity</th>
                <th>Requested price</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="orders-table"></tbody>
          </table>
        </div>
        <section class="section-heading spaced">
          <div>
            <span class="eyebrow">EXECUTIONS</span>
            <h2>Trade history</h2>
          </div>
        </section>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Stock</th>
                <th>Side</th>
                <th>Quantity</th>
                <th>Fill price</th>
                <th>Brokerage</th>
                <th>Price impact</th>
              </tr>
            </thead>
            <tbody id="trades-table"></tbody>
          </table>
        </div>
      </main>
    </div>
    <div id="toast-region" class="toast-region"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
