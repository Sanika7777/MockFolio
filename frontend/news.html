<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>News | MockFolio</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="news">
    <div id="app">
      <main class="page">
        <section class="page-intro compact-intro">
          <span class="eyebrow">MARKET NEWS</span>
          <h1>What's moving markets.</h1>
          <p>Headlines from TradingView's news desk, filtered by market.</p>
        </section>
        <section class="toolbar feed-toolbar" id="news-controls"></section>
        <div class="panel tv-widget-panel tv-feed" id="tv-news"></div>
        <p class="chart-caption">Provided by TradingView. Real-world data, separate from MockFolio's simulated prices.</p>
      </main>
    </div>
    <div id="toast-region" class="toast-region"></div>
    <script src="js/api.js"></script>
    <script src="js/tradingview.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
